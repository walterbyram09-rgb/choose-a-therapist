<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Therapist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .therapists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin: 10px 0;
    }

    select, button {
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #219150;
    }

    .booking {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #2c3e50;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Choose a Therapist</h1>
  <p>Select your preferred therapist and massage duration</p>
</header>

<div class="container">
  <div class="therapists">

    <div class="card">
      <h3>Walter Byram</h3>
      <p>Expert in relaxation massage</p>
      <select>
        <option value="">Select Duration</option>
        <option>60 Minutes</option>
        <option>90 Minutes</option>
        <option>120 Minutes</option>
      </select>
      <button onclick="book('Walter Byram')">Book Now</button>
    </div>

    <div class="card">
      <h3>Anna Cruz</h3>
      <p>Specialist in deep tissue massage</p>
      <select>
        <option value="">Select Duration</option>
        <option>60 Minutes</option>
        <option>90 Minutes</option>
        <option>120 Minutes</option>
      </select>
      <button onclick="book('Anna Cruz')">Book Now</button>
    </div>

    <div class="card">
      <h3>Mark Reyes</h3>
      <p>Therapeutic and sports massage</p>
      <select>
        <option value="">Select Duration</option>
        <option>60 Minutes</option>
        <option>90 Minutes</option>
        <option>120 Minutes</option>
      </select>
      <button onclick="book('Mark Reyes')">Book Now</button>
    </div>

  </div>

  <div class="booking" id="bookingResult">
    <h2>Booking Details</h2>
    <p>No booking yet.</p>
  </div>
</div>

<footer>
  <p>&copy; 2026 Choose a Therapist</p>
</footer>

<script>
  function book(name) {
    const cards = document.querySelectorAll('.card');
    let selectedDuration = '';

    cards.forEach(card => {
      if (card.querySelector('h3').innerText === name) {
        selectedDuration = card.querySelector('select').value;
      }
    });

    if (!selectedDuration) {
      alert('Please select a duration first!');
      return;
    }

    // Show booking details
    document.getElementById('bookingResult').innerHTML = `
      <h2>Booking Confirmed</h2>
      <p><strong>Therapist:</strong> ${name}</p>
      <p><strong>Duration:</strong> ${selectedDuration}</p>
      <p>You will now be redirected to PayPal to complete your payment.</p>
    `;

    // Redirect to PayPal
    const paypalLink = `https://www.paypal.com/paypalme/walterbyram82`;

    setTimeout(() => {
      window.open(paypalLink, '_blank');
    }, 1500);
  }
</script>

</body>
</html>
